content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-04-06

  ## Architecture Overview

  ```
  Settings (SQLite)                      Executor Pipeline
  ┌──────────────────────┐             ┌───────────────────────┐
  │ litellmProxy:        │  Provider   │ buildSpawnEnv()        │
  │   baseUrl, apiKey    │────────────►│                        │
  │   claudeCode: {..}   │  threads    │ Claude Code:           │   spawn
  │   geminiCli:         │  proxy      │   ANTHROPIC_BASE_URL   │──────► claude
  │     routingMode      │  config     │   ANTHROPIC_AUTH_TOKEN  │
  │   codexCli:          │             │                        │
  │     routingMode      │             │ Gemini CLI:            │   spawn
  └──────────────────────┘             │   GOOGLE_GEMINI_BASE.. │──────► gemini
                                       │   GEMINI_API_KEY       │
                                       │                        │
                                       │ Codex CLI:             │   spawn
                                       │   OPENAI_BASE_URL      │──────► codex
                                       │   OPENAI_API_KEY       │
                                       └───────────────────────┘

  Settings UI (Routing Section)
  ┌────────────────────────────────────────┐
  │ Agent: Claude Code → mode + headers    │
  │ Agent: Gemini CLI  → mode (2 options)  │
  │ Agent: Codex CLI   → mode (2 options)  │
  │ Agent: Cursor      → docs panel        │
  │ Agent: Copilot CLI → docs panel        │
  └────────────────────────────────────────┘
  ```

  ## Implementation Strategy

  **MANDATORY TDD**: Phases 2 and 3 are TDD-driven.

  ### Phase 1: Foundation (TypeSpec + DB + Persistence)

  Add GeminiCliProxyConfig and CodexCliProxyConfig to TypeSpec, run codegen.
  Migration 056 adds 2 TEXT columns. Settings mapper and repository SQL synced.
  This is mechanical — follows the exact pattern from spec 084 (migration 055).

  ### Phase 2-3: Executor Injection (TDD, one per agent)

  Each Tier 1 agent gets a RED-GREEN cycle. Gemini CLI is first because it has
  the env var conflict (proxy key overrides auth token). Codex CLI is second
  because it uses separate env vars (simpler). Both follow the Claude Code
  `updateProxyConfig()` + `buildSpawnEnv()` pattern.

  ### Phase 4: Provider + Worker Threading

  Add instanceof checks for GeminiCliExecutorService and CodexCliExecutorService
  alongside the existing ClaudeCodeExecutorService check. Both in provider and
  worker. Add provider tests for the new agents.

  ### Phase 5: Agent-Aware UI + Tier 2 Documentation Panels

  Extend LiteLLMProxyRoutingSection to detect settings.agent.type and render:
  - Tier 1 agents: Direct/Proxy mode selector
  - Cursor: Documentation panel with auto-appended /cursor URL + API key
  - Copilot: Documentation panel with VS Code settings.json snippet
  - i18n across all 8 locales + Storybook stories per agent variant

  ## Files to Create/Modify

  ### New Files

  | File | Purpose |
  | ---- | ------- |
  | `migrations/056-add-litellm-proxy-multi-agent.ts` | 2 TEXT columns |
  | `gemini-cli-executor-proxy.test.ts` | TDD tests for Gemini proxy injection |
  | `codex-cli-executor-proxy.test.ts` | TDD tests for Codex proxy injection |

  ### Modified Files

  | File | Changes |
  | ---- | ------- |
  | `settings.tsp` | Add GeminiCliProxyConfig + CodexCliProxyConfig models |
  | `output.ts` | Regenerated |
  | `settings.mapper.ts` | SettingsRow + toDatabase + fromDatabase for 2 columns |
  | `sqlite-settings.repository.ts` | INSERT + UPDATE for 2 columns |
  | `gemini-cli-executor.service.ts` | updateProxyConfig + buildSpawnEnv override |
  | `codex-cli-executor.service.ts` | updateProxyConfig + buildSpawnEnv override |
  | `agent-executor-provider.service.ts` | instanceof checks for Gemini + Codex |
  | `feature-agent-worker.ts` | instanceof checks for Gemini + Codex |
  | `litellm-proxy-routing-section.tsx` | Agent-aware rendering + Tier 2 doc panels |
  | `litellm-proxy-routing-section.stories.tsx` | Stories per agent variant |
  | `translations/*/web.json` | i18n keys for agent-specific labels |
  | `settings.mapper.test.ts` | Add gc/cx columns to mock row |
  | `agent-executor-provider.test.ts` | Tests for Gemini/Codex proxy threading |
  | `sqlite-settings.repository.test.ts` | Round-trip tests for gc/cx columns |

  ## Testing Strategy (TDD: Tests FIRST)

  ### Unit Tests (RED -> GREEN -> REFACTOR)

  - **Gemini CLI injection** (Phase 2): 6-8 tests — direct mode preserves authConfig token, proxy mode overrides with proxy key + sets base URL, missing baseUrl/apiKey edge cases
  - **Codex CLI injection** (Phase 3): 6-8 tests — direct mode preserves CODEX_API_KEY, proxy mode sets OPENAI_BASE_URL + OPENAI_API_KEY (not CODEX_API_KEY), edge cases
  - **Provider threading** (Phase 4): Tests that provider calls updateProxyConfig on Gemini + Codex executors

  ### Integration Tests

  - **Persistence round-trip** (Phase 1): Save/load gc/cx routing mode columns

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Gemini API key conflict breaks direct auth | Proxy check before authConfig check in buildSpawnEnv — early return on proxy |
  | Codex dual-key confusion | Clear comments: CODEX_API_KEY for direct, OPENAI_API_KEY for proxy |
  | Cursor /cursor suffix changes in future LiteLLM | Document in instructions panel; single constant for easy update |
  | Copilot debug settings removed by VS Code | Note in docs panel that these are undocumented settings |

