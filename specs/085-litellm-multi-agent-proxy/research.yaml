decisions:
  - title: "Gemini CLI env var conflict: authConfig.token vs proxy key in GEMINI_API_KEY"
    chosen: "Proxy mode overrides authConfig token — proxy key takes precedence in GEMINI_API_KEY"
    rejected:
      - "Use a different env var for proxy key (no such env var exists for Gemini CLI)"
      - "Require user to remove authConfig.token when using proxy (poor UX)"
    rationale: >
      LiteLLM's Gemini CLI integration uses the same GEMINI_API_KEY env var for the
      proxy virtual key. When proxy mode is active, the proxy key must replace the
      user's Google API key in this variable. The buildSpawnEnv() override should
      check proxy mode first: if proxy, set GEMINI_API_KEY to proxy key and
      GOOGLE_GEMINI_BASE_URL to proxy URL; if direct, fall through to existing
      authConfig.token injection. This is safe because when routing through the
      proxy, the proxy handles auth to Google — the user's key is not needed.

  - title: "Codex CLI env var strategy: CODEX_API_KEY vs OPENAI_API_KEY"
    chosen: "Set OPENAI_API_KEY + OPENAI_BASE_URL in proxy mode; preserve CODEX_API_KEY from authConfig in direct mode"
    rejected:
      - "Override CODEX_API_KEY with proxy key (wrong env var for LiteLLM routing)"
      - "Set both CODEX_API_KEY and OPENAI_API_KEY (confusing dual-auth)"
    rationale: >
      LiteLLM expects OPENAI_API_KEY (not CODEX_API_KEY) for OpenAI-compatible
      proxy routing. The Codex CLI uses CODEX_API_KEY for direct OpenAI auth but
      accepts OPENAI_BASE_URL + OPENAI_API_KEY for proxy routing. In proxy mode,
      we set OPENAI_BASE_URL + OPENAI_API_KEY (proxy key) and do NOT set
      CODEX_API_KEY. In direct mode, we preserve the existing authConfig.token
      injection as CODEX_API_KEY.

  - title: "TypeSpec model structure: Shared vs per-agent proxy config"
    chosen: "Minimal per-agent models with only routingMode field (reuse LiteLLMProxyRoutingMode enum)"
    rejected:
      - "Full ClaudeCodeProxyConfig clone for each agent (too much duplication)"
      - "Single shared AgentProxyConfig used by all agents (loses agent-specific flexibility)"
    rationale: >
      Gemini CLI and Codex CLI only need routingMode (direct/proxy — no passthrough,
      no custom headers, no model overrides). Claude Code needed 5 fields because
      of its richer integration surface (custom headers, 3 model overrides). Creating
      minimal models keeps the schema clean and avoids empty columns. If future
      agents need more fields, their model can be extended independently.

