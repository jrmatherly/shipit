content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-04-06

  ## Codebase Analysis

  ### Existing Executor Proxy Support

  | Executor | Has authConfig | Has buildSpawnEnv | Current Env Vars | Proxy Changes Needed |
  | --- | --- | --- | --- | --- |
  | Claude Code | No (uses proxyConfig) | Yes (full proxy logic) | ANTHROPIC_BASE_URL, AUTH_TOKEN, CUSTOM_HEADERS, model overrides | Done (spec 084) |
  | Gemini CLI | Yes | Yes (GEMINI_API_KEY) | GEMINI_API_KEY from token | Add proxyConfig + GOOGLE_GEMINI_BASE_URL + override GEMINI_API_KEY |
  | Codex CLI | Yes | Yes (CODEX_API_KEY) | CODEX_API_KEY from token | Add proxyConfig + OPENAI_BASE_URL + OPENAI_API_KEY (different from CODEX_API_KEY) |
  | Cursor | No | No | None | Documentation only — no env var injection possible |
  | Copilot CLI | No | No | None | Documentation only — no env var injection possible |

  ### Env Var Conflict Resolution

  **Gemini CLI — Same env var, different values:**
  - Direct mode: `GEMINI_API_KEY = authConfig.token` (user's Google API key)
  - Proxy mode: `GEMINI_API_KEY = proxyConfig.apiKey` (LiteLLM proxy key)
  - Resolution: proxy mode takes precedence. When proxy is active, the proxy
    handles auth to Google, so the user's key is not needed.

  **Codex CLI — Different env vars for different purposes:**
  - Direct mode: `CODEX_API_KEY = authConfig.token` (user's OpenAI key)
  - Proxy mode: `OPENAI_API_KEY = proxyConfig.apiKey` + `OPENAI_BASE_URL = proxyConfig.baseUrl`
  - Resolution: no conflict. Different env vars. In proxy mode, skip CODEX_API_KEY.

  ## Technology Decisions

  ### 1. Gemini CLI: Proxy Key Overrides Auth Token

  In proxy mode, `GEMINI_API_KEY` is set to the proxy key (not the user's Google
  key). The `buildSpawnEnv()` override checks proxy mode first:

  ```typescript
  protected override buildSpawnEnv(): Record<string, string | undefined> {
    const env = super.buildSpawnEnv();

    // Proxy mode takes precedence over authConfig token
    if (this.proxyConfig?.geminiCli?.routingMode === 'proxy' && this.proxyConfig.baseUrl) {
      env.GOOGLE_GEMINI_BASE_URL = this.proxyConfig.baseUrl;
      if (this.proxyConfig.apiKey) {
        env.GEMINI_API_KEY = this.proxyConfig.apiKey;
      }
      return env;
    }

    // Direct mode: existing authConfig token injection
    if (this.authConfig?.authMethod === 'token' && this.authConfig.token) {
      env.GEMINI_API_KEY = this.authConfig.token;
    }
    return env;
  }
  ```

  ### 2. Codex CLI: Separate Env Vars for Proxy

  Codex uses OPENAI_API_KEY (not CODEX_API_KEY) for LiteLLM proxy routing:

  ```typescript
  protected override buildSpawnEnv(): Record<string, string | undefined> {
    const env = super.buildSpawnEnv();

    // Proxy mode: use OpenAI-compatible env vars for LiteLLM
    if (this.proxyConfig?.codexCli?.routingMode === 'proxy' && this.proxyConfig.baseUrl) {
      env.OPENAI_BASE_URL = this.proxyConfig.baseUrl;
      if (this.proxyConfig.apiKey) {
        env.OPENAI_API_KEY = this.proxyConfig.apiKey;
      }
      return env;
    }

    // Direct mode: existing authConfig token injection
    if (this.authConfig?.authMethod === 'token' && this.authConfig.token) {
      env.CODEX_API_KEY = this.authConfig.token;
    }
    return env;
  }
  ```

  ### 3. Minimal Per-Agent TypeSpec Models

  ```typespec
  model GeminiCliProxyConfig {
    routingMode?: LiteLLMProxyRoutingMode;  // Reuse existing enum (direct/proxy only)
  }

  model CodexCliProxyConfig {
    routingMode?: LiteLLMProxyRoutingMode;  // Reuse existing enum (direct/proxy only)
  }

  model LiteLLMProxyConfig {
    // ... existing fields ...
    claudeCode?: ClaudeCodeProxyConfig;   // existing
    geminiCli?: GeminiCliProxyConfig;     // NEW
    codexCli?: CodexCliProxyConfig;       // NEW
  }
  ```

  DB columns: `litellm_proxy_gc_routing_mode TEXT` and `litellm_proxy_cx_routing_mode TEXT`
  (gc = gemini cli, cx = codex cli — follows the `cc` prefix pattern from spec 084).

  ### 4. UI: Agent-Aware Routing Section

  The existing `LiteLLMProxyRoutingSection` component gains agent-type awareness:

  ```
  settings.agent.type === 'claude-code'  → Full routing UI (existing from spec 084)
  settings.agent.type === 'gemini-cli'   → Direct/Proxy mode selector
  settings.agent.type === 'codex-cli'    → Direct/Proxy mode selector
  settings.agent.type === 'cursor'       → Documentation panel (Cursor config instructions)
  settings.agent.type === 'copilot-cli'  → Documentation panel (VS Code settings.json snippet)
  settings.agent.type === 'rovo-dev'     → "Not supported" message
  ```

  ### 5. Provider Threading (Extend Existing Pattern)

  Add instanceof checks alongside the existing Claude Code check:

  ```typescript
  if (executor instanceof ClaudeCodeExecutorService) {
    executor.updateProxyConfig(settings.litellmProxy);
  } else if (executor instanceof GeminiCliExecutorService) {
    executor.updateProxyConfig(settings.litellmProxy);
  } else if (executor instanceof CodexCliExecutorService) {
    executor.updateProxyConfig(settings.litellmProxy);
  }
  ```

  ## Library Analysis

  No new libraries needed. All existing dependencies.

  ## Security Considerations

  - Same security model as spec 084: env vars only, never CLI args
  - Gemini CLI proxy mode replaces the user's Google API key with the proxy key —
    the user's key is not leaked to the proxy, and the proxy key is not leaked to Google
  - Codex CLI uses a different env var (OPENAI_API_KEY) for proxy, so the user's
    CODEX_API_KEY is never sent to the proxy

  ## Performance Implications

  Zero runtime overhead — same as spec 084 (env var injection at spawn time only).

  ## Open Questions

  All resolved:
  1. Cursor URL suffix → auto-append /cursor
  2. Copilot config → documentation-only panel
  3. Gemini/Codex routing modes → direct + proxy only (no passthrough)

