content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-04-06

  ## Architecture Overview

  ```
  LiteLLM Proxy                    ShipIT                         Claude Code CLI
  +----------------+    HTTP GET   +-------------------+  execFile +----------------+
  | /claude-code/  |<-------------|PluginMarketplace   |--------->| claude plugin   |
  | marketplace.   |  marketplace  | Service            | install/ | install/list/   |
  | json           |   catalog     | (infra layer)      | list/etc | enable/etc      |
  +----------------+              +-------------------+           +----------------+
                                         |
                                    Use Cases
                                    (app layer)
                                         |
                                  Server Actions
                                  (presentation)
                                         |
                                  +-------------------+
                                  | Plugins Page UI   |
                                  | (card grid +      |
                                  |  detail drawer)   |
                                  +-------------------+
  ```

  Data flows through Clean Architecture layers:
  1. **LiteLLM Proxy** serves the marketplace catalog via HTTP GET
  2. **PluginMarketplaceService** (infrastructure) fetches catalog + delegates CLI operations
  3. **Use Cases** (application) orchestrate business logic, read settings for proxy config
  4. **Server Actions** (presentation/web) bridge React to use cases via DI string tokens
  5. **Plugins Page** (React) renders card grid with search/filter, drawer details, install/toggle

  ## Implementation Strategy

  **MANDATORY TDD**: All phases with executable code follow RED-GREEN-REFACTOR cycles.

  The 7 phases are ordered by dependency:

  **Phase 1 (Foundation)** establishes the domain model and feature flag first. The feature
  flag gates all subsequent UI work, enabling incremental commits per phase without exposing
  unfinished features. The feature flag chain touches 8 files and must be done atomically.
  This phase also creates the port interface that Phase 2 implements.

  **Phase 2 (Infrastructure Service)** implements `PluginMarketplaceService` -- the first
  HTTP client in the project. Uses Node 22+ native `fetch` with `AbortController` timeout,
  `redirect: 'error'` (SSRF prevention), and 5MB response limit. All subprocess calls use
  `execFile` with strict input validators (regex allowlists). Zod schemas validate both
  proxy responses and CLI output.

  **Phase 3 (Use Cases)** creates 5 presentation-agnostic use cases that compose the service.
  `FetchPluginCatalogUseCase` reads proxy config from settings via `ISettingsReader` and
  merges catalog with installed plugin state. The other 4 are thin delegation + validation.

  **Phase 4 (Server Actions)** bridges React to use cases. Each action resolves via
  `resolve<T>('StringToken')` (never class refs -- Turbopack limitation). Matching Storybook
  mocks are mandatory for `pnpm build:storybook`.

  **Phases 5 & 6 (UI)** can be developed in parallel -- no mutual dependency. Phase 5 is the
  Plugins page (card grid, drawer, search/filter). Phase 6 is the LiteLLM proxy settings
  section. Both depend on Phases 1-4.

  **Phase 7 (E2E)** validates end-to-end with Playwright tests and anti-pattern grep checks.

