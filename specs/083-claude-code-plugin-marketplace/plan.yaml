  ## Testing Strategy (TDD: Tests FIRST)

  **CRITICAL:** Tests are written FIRST in each TDD cycle.

  ### Unit Tests (RED -> GREEN -> REFACTOR)

  - Settings factory: `createDefaultSettings()` includes `plugins: false`
  - Settings mapper: `toDatabase`/`toDomain` round-trips new fields correctly
  - Input validators: valid/invalid plugin names, URLs, scopes
  - Zod schemas: accept valid catalog, reject malformed entries
  - PluginMarketplaceService: mock `fetch` + `SpawnFunction`, verify all 6 methods
  - Error paths: proxy unreachable, invalid JSON, timeout, binary not found
  - Use cases: mock service, verify success/error/not-configured paths
  - Server actions: mock `@/lib/server-container`, verify DI resolution + error handling
  - Component tests: render states, search filter, category filter, drawer, install/toggle

  ### Integration Tests

  - Migration 054: verify column addition via SQLite
  - Settings mapper end-to-end with new columns

  ### E2E Tests (Playwright)

  - Navigate to /plugins with flag on + Claude Code agent -- page renders
  - Navigate to /plugins with flag off -- 404
  - Settings shows LiteLLM proxy section
  - Plugin cards render from catalog data

  ### Anti-Pattern Grep Checks

  - No direct `~/.claude/` filesystem reads
  - No hardcoded proxy URLs outside test fixtures
  - No `claude plugin search` usage
  - No `shell: true` in subprocess calls
  - No `resolve(ClassRef)` in server actions

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Claude CLI output format changes between versions | Zod schema validation catches format drift; fail gracefully with error |
  | LiteLLM marketplace endpoint unavailable/changed | Timeout + error handling returns empty catalog; user sees setup instructions |
  | Subprocess command injection via malicious plugin names | Regex allowlist `^[a-zA-Z0-9_-]+$` + execFile without shell: true |
  | SSRF via proxy URL pointing to internal services | URL scheme validation + `redirect: 'error'` + HTTPS required for non-localhost |
  | API key leaked in error messages | Generic error responses only; never expose raw error.message to client |
  | Feature flag chain incomplete (breaks existing UI) | Atomic Phase 1 with full chain + i18n parity; test immediately |
  | Storybook build breaks from missing mocks | Create mocks alongside server actions (Phase 4) |
  | Large proxy response causes memory exhaustion | 5MB response size limit before JSON parse |

  ## Rollback Plan

  The feature flag (`featureFlags.plugins`, defaults to `false`) gates all UI.
  If issues are found post-merge:
  1. Flag is off by default -- no user impact unless explicitly enabled
  2. Settings migration 054 adds columns (non-destructive, no data loss on rollback)
  3. The port interface + service can be removed without affecting other features
  4. No changes to existing agent executor or settings behavior

