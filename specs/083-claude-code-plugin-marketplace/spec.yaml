  ## Architecture

  **Thin proxy approach:** ShipIT fetches the marketplace catalog from LiteLLM and
  delegates all plugin lifecycle operations to the `claude` CLI subprocess.

  ```
  LiteLLM Proxy                    ShipIT                         Claude Code CLI
  ┌──────────────┐    HTTP GET    ┌─────────────────┐   execFile  ┌──────────────┐
  │ /claude-code/ │◄─────────────│ PluginMarketplace│───────────►│ claude plugin │
  │ marketplace.  │  marketplace  │ Service          │  install/  │ install/list/ │
  │ json          │   catalog     │                  │  list/etc  │ enable/etc    │
  └──────────────┘               └─────────────────┘            └──────────────┘
                                        │
                                        ▼
                                 ┌─────────────────┐
                                 │ Plugins Page UI  │
                                 │ (card grid +     │
                                 │  detail drawer)  │
                                 └─────────────────┘
  ```

  ## Security Requirements

  All data from the LiteLLM proxy is untrusted attacker-controlled input:
  - Subprocess arguments validated via regex allowlists before execFile
  - URL scheme validation (http/https only, HTTPS required for non-localhost)
  - Zod runtime schema validation for all proxy responses AND CLI output
  - UI string truncation and URL scheme validation before rendering
  - API key over HTTPS only, plaintext SQLite storage (consistent with agent.token)
  - Concurrency mutex for plugin operations (one at a time)
  - Generic error messages to client (no internal details)

  ## Dependencies

  - Spec 005 (Global Settings Service) -- extends Settings model with LiteLLMProxyConfig
  - Spec 013 (Feature Agent) -- agent type awareness for conditional UI
  - Spec 082 (Agent Permission Modes) -- permission mode system for Claude Code executor

  ## Size Estimate

  **XL** -- ~35 new files, ~14 modified files, ~2,500 lines across 7 implementation
  phases. Spans all architecture layers: TypeSpec domain model, SQLite migration,
  infrastructure service (first HTTP client in project), 5 use cases, 5 server actions,
  new route/page/components, settings section, feature flag chain, E2E tests.
  Extensive security validation requirements add complexity.

