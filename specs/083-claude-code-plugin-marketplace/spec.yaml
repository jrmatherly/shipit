# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Claude Code plugins (skills, agents, hooks, MCP servers, LSP servers) are powerful
  extensibility mechanisms, but discovery and installation is CLI-only via
  `claude plugin install <name>@<marketplace>`. Organizations running a LiteLLM proxy
  can curate approved plugins via the `/claude-code/marketplace.json` endpoint, but
  there is no GUI for browsing this catalog, understanding what each plugin does, or
  managing installations.

  ShipIT already supports Claude Code as a first-class agent with both batch and
  interactive executors. Adding plugin marketplace support gives users a visual
  catalog, lets admins govern plugin availability, and reduces friction for discovery
  and installation -- all from the ShipIT web UI.

  ## Success Criteria

  - [ ] Users can browse a plugin catalog fetched from their LiteLLM proxy marketplace
  - [ ] Users can search plugins by name/description and filter by category
  - [ ] Users can install/uninstall plugins via UI buttons (delegates to `claude` CLI)
  - [ ] Users can enable/disable installed plugins via UI toggles
  - [ ] Plugin installation state is accurately reflected (installed, enabled, disabled)
  - [ ] LiteLLM proxy URL and API key are configurable in Settings
  - [ ] "Test Connection" button validates proxy connectivity
  - [ ] Feature is gated behind `featureFlags.plugins` (off by default)
  - [ ] Plugins page only visible when agent type is Claude Code
  - [ ] All proxy-supplied data is validated (Zod schemas) and sanitized before rendering
  - [ ] Subprocess arguments are validated against allowlists (no command injection)
  - [ ] All 8 locale files have complete i18n key parity
  - [ ] Every UI component has a colocated Storybook story
  - [ ] TDD workflow followed: failing tests first in every phase

  ## Affected Areas

