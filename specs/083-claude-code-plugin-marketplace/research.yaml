# Structured technology decisions
decisions:
  - title: Architecture approach - thin proxy vs deep integration
    chosen: >
      Thin proxy: ShipIT fetches marketplace catalog from LiteLLM via HTTP,
      delegates all plugin lifecycle operations (install/uninstall/enable/disable)
      to the claude CLI subprocess
    rejected:
      - >
        Deep integration: ShipIT manages plugin lifecycle directly by reading/writing
        ~/.claude/plugins/ files and implementing caching, version resolution, and
        hook registration internally
    rationale: >
      Claude Code's plugin system handles caching, version management, dependency
      resolution, and hook registration internally. Reimplementing any of this is
      fragile and breaks on Claude Code version updates. ShipIT's role is limited to:
      (1) UI layer for browsing with rich cards/search/filter, (2) installation bridge
      via claude CLI subprocess, (3) status awareness via claude plugin list --json,
      (4) settings integration for LiteLLM proxy URL storage. This was the unanimous
      recommendation from the 4-agent architecture review.

  - title: HTTP client library
    chosen: >
      Node 22+ built-in fetch with AbortController timeout pattern. No external library.
      This establishes the first HTTP client pattern in the infrastructure layer.
    rejected:
      - axios (unnecessary dependency for simple GET request)
      - node-fetch (Node 22+ has native fetch)
      - got (heavy, unnecessary features)
    rationale: >
      Node 22+ (project minimum) includes native fetch. A single GET to the marketplace
      endpoint does not justify adding an HTTP library dependency. The pattern uses
      AbortController for 10s timeout, redirect: 'error' to prevent SSRF, and response
      size limit (5MB). This establishes a reusable pattern for future HTTP integrations
      without adding dependencies.

  - title: Runtime validation strategy
    chosen: >
      Zod schemas for all external data boundaries: LiteLLM proxy JSON response,
      claude plugin list --json CLI output, and all user-supplied inputs (plugin names,
      URLs, scopes)
    rejected:
      - TypeSpec-generated types only (no runtime validation)
      - io-ts (less ecosystem adoption, heavier syntax)
      - ajv/JSON Schema (less ergonomic for TypeScript)
    rationale: >
      All data from LiteLLM proxy is untrusted. Zod is already a project dependency and
      provides TypeScript-native runtime validation. The security review identified that
      every field must be validated before it reaches subprocess arguments or the UI.
      Zod schemas validate at two boundaries: (1) HTTP response from LiteLLM, (2) JSON
      output from claude CLI subprocess.

  - title: Subprocess argument safety
    chosen: >
      Input validation via regex allowlists + execFile with arguments as separate array
      elements. Plugin names validated against ^[a-zA-Z0-9_-]+$, scope against exact
      allowlist ('user' | 'project' | 'local'), URLs against scheme validation.
      Never shell: true, never string concatenation.
    rejected:
      - shell-quote npm package (CodeQL does not model it as a sanitizer)
      - Custom shell-escape functions (CodeQL treats as opaque, taint flows through)
      - Relying on execFile alone without input validation
    rationale: >
      The security review identified subprocess command injection as the highest-risk
      attack vector. execFile without shell: true prevents shell metacharacter injection,
      but input validation adds defense-in-depth. The regex allowlists are intentionally
      strict to reject any unexpected characters. shell-quote was explicitly rejected because
      CodeQL's js/command-line-injection does not recognize it (zero references in CodeQL's
      javascript/ql/lib/semmle/javascript/frameworks/).

  - title: Plugin state tracking
    chosen: >
      Query claude plugin list --json at runtime for current installation state.
      Do NOT read/write ~/.claude/plugins/ files directly.
    rejected:
      - Read installed_plugins.json directly from filesystem
      - Maintain a shadow copy of plugin state in ShipIT's SQLite
    rationale: >
      Claude Code owns its plugin state files and their internal format may change
      between versions. The CLI provides a stable interface via --json flag.
      Reading files directly would create a fragile coupling. The CLI command was
      empirically verified: claude plugin list --json and --available flags both
      confirmed working.

  - title: Feature flag placement
    chosen: >
      Add plugins feature flag in Phase 1 (domain model phase) so all subsequent
      phases can gate behind it from the start. Flag added to TypeSpec FeatureFlags
      model, defaults to false.
    rejected:
      - Add feature flag in the UI phase (Phase 5) when first needed
    rationale: >
      Adding the flag early enables incremental commits per phase without exposing
      unfinished UI. The feature flag chain touches 8 files (TypeSpec model, codegen,
      factory, migration, mapper, feature-flags.ts, settings section, i18n) and must
      be done atomically. Deferring it would block Phase 5+6 parallelization.

  - title: Settings persistence for LiteLLM proxy config
    chosen: >
      SQLite columns (litellm_proxy_base_url, litellm_proxy_api_key,
      litellm_proxy_marketplace_enabled, feature_flag_plugins) added via migration 054.
      Flattened column layout matching existing settings mapper pattern.
    rejected:
      - JSON blob column for proxy config
      - Separate litellm_config table
    rationale: >
      The existing settings mapper uses flattened columns for nested domain objects
      (e.g., agent config fields are separate columns, not a JSON blob). Following
      this pattern ensures consistency and enables SQL-level queries. The migration
      number 054 follows the existing sequence.

  - title: UI component library for plugins page
    chosen: >
      Reuse existing editorial design system components (SettingsSection, SettingsRow,
      SwitchRow, BaseDrawer, card grid patterns from Tools page). No new component
      library dependencies.
    rejected:
      - New card component library
      - Custom grid system
    rationale: >
      The Tools page and Skills page already provide browse/install patterns with card
      grids and drawer details. The editorial design system (Stitch refresh) has
      established tokens and utility classes. Reusing these patterns ensures visual
      consistency and reduces implementation scope.

  - title: Sidebar icon for plugins
    chosen: Blocks icon from lucide-react
    rejected:
      - Puzzle icon (already used by Skills page)
      - Package icon (too generic)
    rationale: >
      The Puzzle icon is already assigned to the Skills nav item. Blocks conveys
      the concept of composable plugin components. Identified during 4-agent
      architecture review to prevent icon collision.

