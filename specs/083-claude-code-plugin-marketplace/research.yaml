# Markdown content (the full research document)
content: |
  ## Status

  - **Phase:** Research
  - **Updated:** 2026-04-06
  - **Review iterations:** 3 (v1 initial, v2 CLI-corrected, v3 team-reviewed with 36 findings)

  ## Technology Decisions

  ### Architecture: Thin Proxy vs Deep Integration

  **Options considered:**

  1. **Thin proxy (chosen):** ShipIT fetches marketplace catalog from LiteLLM via HTTP GET,
     delegates all plugin lifecycle operations to the `claude` CLI subprocess
  2. **Deep integration (rejected):** ShipIT manages plugin lifecycle directly by reading/writing
     `~/.claude/plugins/` files and implementing caching, version resolution, and hook registration

  **Decision:** Thin proxy

  **Rationale:** Claude Code's plugin system handles caching, version management, dependency
  resolution, and hook registration internally. Reimplementing any of this is fragile and breaks
  on Claude Code version updates. ShipIT's role is: (1) UI layer for browsing, (2) installation
  bridge via subprocess, (3) status awareness via `claude plugin list --json`, (4) settings
  integration for proxy URL storage. Unanimous recommendation from the 4-agent architecture review.

  ### HTTP Client: Native fetch vs External Library

  **Options considered:**

  1. **Node 22+ built-in fetch (chosen)** with AbortController timeout
  2. axios -- unnecessary dependency for a single GET
  3. node-fetch -- Node 22+ has native fetch
  4. got -- heavy, unnecessary features

  **Decision:** Native fetch

  **Rationale:** This is the first HTTP client in the infrastructure layer. The pattern uses
  AbortController for 10s timeout, `redirect: 'error'` to prevent SSRF, and response size
  limit (5MB). This establishes a reusable pattern for future HTTP integrations without
  adding dependencies.

  ### Runtime Validation: Zod Schemas

  **Options considered:**

  1. **Zod (chosen)** -- already a project dependency, TypeScript-native
  2. TypeSpec-generated types only -- no runtime validation (rejected: unsafe)
  3. io-ts -- less ecosystem adoption
  4. ajv/JSON Schema -- less ergonomic for TypeScript

  **Decision:** Zod at all external data boundaries

  **Rationale:** All data from LiteLLM proxy is untrusted. Zod validates at two boundaries:
  (1) HTTP response from LiteLLM, (2) JSON output from `claude` CLI subprocess. The security
  review identified this as critical for both injection prevention and UI safety.

  ### Subprocess Security: Allowlist Validators

  **Options considered:**

  1. **Regex allowlists + execFile with array args (chosen)**
  2. shell-quote npm package (rejected: CodeQL does not model it as sanitizer)
  3. Custom shell-escape functions (rejected: CodeQL treats as opaque)
  4. execFile alone without input validation (rejected: insufficient defense-in-depth)

  **Decision:** Strict input validation + execFile

  **Rationale:** Plugin names must match `^[a-zA-Z0-9_-]+$`. Scope must exactly match
  `'user' | 'project' | 'local'`. URLs validated for scheme. Arguments always as separate
  array elements to `execFile`. `shell-quote` was explicitly rejected because CodeQL's
  `js/command-line-injection` does not recognize it (zero references in CodeQL's
  `javascript/ql/lib/semmle/javascript/frameworks/`).

  ### Plugin State: CLI Query vs Filesystem Read

  **Options considered:**

  1. **Query `claude plugin list --json` at runtime (chosen)**
  2. Read `installed_plugins.json` directly (rejected: fragile coupling)
  3. Shadow copy in ShipIT's SQLite (rejected: sync complexity)

  **Decision:** CLI query

  **Rationale:** Claude Code owns its plugin state files. Internal format may change between
  versions. The CLI provides a stable `--json` interface. Both `--json` and `--available`
  flags empirically verified.

  ## Library Analysis

  | Library | Version | Purpose | Pros | Cons |
  | --- | --- | --- | --- | --- |
  | Zod | existing dep | Runtime validation of proxy responses + CLI output | Already in project, TS-native, great error messages | Adds ~200 lines of schema definitions |
  | Node fetch | Node 22+ built-in | HTTP GET to LiteLLM marketplace endpoint | Zero dependency, native AbortController support | Less feature-rich than axios/got (sufficient) |
  | lucide-react | existing dep | Blocks icon for sidebar nav | Already in project, consistent with other nav icons | None |

  No new dependencies required. All technologies are already in the project stack.

  ## CLI Command Verification

  All commands empirically verified on local machine:

  | Command | Status | Notes |
  | --- | --- | --- |
  | `claude plugin install <name>@<marketplace> --scope <scope>` | VERIFIED | All flags confirmed |
  | `claude plugin uninstall <name>@<marketplace>` | VERIFIED | |
  | `claude plugin enable <name>@<marketplace>` | VERIFIED | |
  | `claude plugin disable <name>@<marketplace>` | VERIFIED | |
  | `claude plugin list --json --available` | VERIFIED | Both flags confirmed |
  | `claude plugin marketplace add/list/remove/update` | VERIFIED | All subcommands exist |
  | `claude plugin validate` | VERIFIED | Validates manifests |
  | `claude plugin search` | **DOES NOT EXIST** | Removed from plan; use `list --available` |

  ## Security Considerations

  All data from the LiteLLM proxy is **untrusted attacker-controlled input**:

  1. **Subprocess argument validation:** Plugin names must match `^[a-zA-Z0-9_-]+$`.
     Scope must be exactly `'user' | 'project' | 'local'`. Arguments always passed as
     separate array elements to `execFile` (never concatenated, never `shell: true`).

  2. **URL validation:** Proxy base URL must be `http:` or `https:` scheme only. HTTPS
     required for non-localhost URLs. Request timeout (10s) and response size limit (5MB).
     No redirect following (`redirect: 'error'` prevents SSRF).

  3. **UI sanitization:** Truncate display strings (name: 100 chars, description: 2000 chars).
     Validate source URLs against `https:` scheme before rendering as links. Never render
     raw HTML from proxy data.

  4. **Runtime schema validation:** Zod validates proxy JSON responses AND `claude plugin
     list --json` output before processing. Reject malformed entries.

  5. **API key security:** Stored plaintext in SQLite (consistent with existing `agent.token`
     pattern). Never logged or included in error responses. Require HTTPS when transmitting.

  6. **Concurrency guard:** Single mutex for plugin operations (one install/uninstall/toggle
     at a time). Subprocess timeout: 30s.

  7. **Error privacy:** "Test Connection" and all server actions return generic success/failure
     only. No detailed error messages to client. Log details server-side.

  ## Performance Implications

  1. **Catalog fetch latency:** HTTP GET to LiteLLM proxy adds ~100-500ms per page load.
     Catalog is fetched on-demand (no background polling). Future optimization: consider
     client-side caching with SWR/stale-while-revalidate pattern.

  2. **Subprocess overhead:** Each `claude plugin list --json` spawns a child process (~200ms).
     Called once per page load to determine installation state. Acceptable for a settings-tier page.

  3. **Response size limit:** 5MB cap prevents memory exhaustion from malicious proxy responses.
     Typical marketplace catalogs are well under 100KB.

  4. **No background sync:** Plugin state is queried on-demand, not polled. This avoids
     background resource usage but means state may be slightly stale if plugins are
     installed/uninstalled via CLI while the page is open.

  ## Anti-Patterns to Avoid

  - Do NOT read/write `~/.claude/settings.json` or `installed_plugins.json` directly
  - Do NOT implement plugin caching (Claude Code handles this)
  - Do NOT parse plugin component files (display metadata only)
  - Do NOT assume marketplace.json format (validate with Zod)
  - Do NOT bundle MCP server functionality (plugins bring their own)
  - Do NOT make UI Claude Code-specific (design for future agent plugin systems)
  - Do NOT use `claude plugin search` (does not exist)
  - Do NOT use `shell: true` or string concatenation for subprocess arguments
  - Do NOT render proxy-supplied URLs without scheme validation
  - Do NOT use `resolve(ClassRef)` in server actions (must use string tokens)

  ## Resolved Questions

  All 7 open questions from spec review have been resolved. See `openQuestions` array above.

  ## Review History

  - **v1:** Initial plan from research agents
  - **v2:** Corrected after empirical CLI verification (removed `search` command, fixed
    TypeSpec path, fixed source schema, added admin endpoints)
  - **v3:** Updated after 4-agent team review (architecture, security, testing, feasibility)
    with 36 findings addressed across critical/high/medium severity

