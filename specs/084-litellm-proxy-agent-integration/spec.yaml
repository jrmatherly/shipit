# Markdown content (the actual spec)
content: |
  ## Problem Statement

  ShipIT currently integrates with LiteLLM proxy only for the plugin marketplace
  (spec 083). The proxy URL and API key are stored in settings but are never used
  to route actual agent API traffic. Users who deploy a LiteLLM proxy for cost
  tracking, prompt caching, model routing, cross-provider fallbacks, or policy
  enforcement cannot leverage it through ShipIT — they must manually configure
  environment variables outside ShipIT.

  Claude Code supports LiteLLM integration via environment variables:
  - `ANTHROPIC_BASE_URL` — points requests to the proxy instead of api.anthropic.com
  - `ANTHROPIC_AUTH_TOKEN` — authenticates to the proxy (virtual key)
  - `ANTHROPIC_CUSTOM_HEADERS` — carries metadata (customer ID, tags, proxy auth for BYOK/Max)
  - `ANTHROPIC_DEFAULT_SONNET_MODEL` / `_HAIKU_MODEL` / `_OPUS_MODEL` — model overrides for
    non-default or non-Anthropic model routing through LiteLLM

  ShipIT already spawns Claude Code via `claude` CLI subprocess and controls its
  environment via `buildSpawnEnv()` in the executor. The integration point is clear:
  inject these env vars based on settings before spawning the process.

  Users with direct Anthropic subscriptions (API key, Max plan, or BYOK) must still
  be able to use ShipIT without a proxy. The proxy integration must be opt-in and
  per-agent, since not all agents may support LiteLLM routing.

  ## Success Criteria

  - [ ] When proxy mode is "proxy", Claude Code spawns with ANTHROPIC_BASE_URL set to the configured proxy URL
  - [ ] When proxy mode is "proxy", Claude Code spawns with ANTHROPIC_AUTH_TOKEN set to the configured proxy API key
  - [ ] When proxy mode is "passthrough", Claude Code spawns with ANTHROPIC_BASE_URL + ANTHROPIC_CUSTOM_HEADERS for proxy auth, forwarding user's own Anthropic credentials
  - [ ] When proxy mode is "direct" (default), no proxy env vars are injected — Claude Code uses its own auth
  - [ ] Custom headers field supports arbitrary header injection (x-litellm-customer-id, x-litellm-tags, etc.)
  - [ ] Model override fields (sonnet, haiku, opus) allow routing to non-default models through LiteLLM
  - [ ] Model override env vars are injected in both "proxy" and "passthrough" modes (but not "direct")
  - [ ] Proxy mode is configurable per-agent in Settings UI (starting with Claude Code only)
  - [ ] Settings UI shows a clear explanation of each mode with contextual help text
  - [ ] Settings UI for passthrough mode shows help text about required proxy-side config
  - [ ] "Test Connection" validates proxy reachability when proxy/passthrough mode is selected
  - [ ] Proxy env var injection happens ONLY in buildSpawnEnv() — no changes to CLI arg construction
  - [ ] All proxy configuration is stored in SQLite via existing settings persistence
  - [ ] Feature is gated: proxy routing only active when litellmProxy.baseUrl is configured
  - [ ] Existing plugin marketplace functionality (spec 083) continues to work unchanged
  - [ ] All 8 locale files have complete i18n key parity for new strings
  - [ ] Every new UI component has a colocated Storybook story
  - [ ] TDD workflow followed: failing tests first in every phase
  - [ ] Pattern is extensible to other agents (Codex, Gemini, Copilot) without architectural changes

  ## Affected Areas

  | Area | Impact | Reasoning |
