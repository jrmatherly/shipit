  | packages/core/src/domain/factories/settings-defaults.factory.ts | Medium | Default values for new proxy agent config fields |
  | packages/core/src/infrastructure/persistence/sqlite/migrations/ | Medium | Migration for new columns (routing mode, custom headers, model overrides) |
  | packages/core/src/infrastructure/persistence/sqlite/mappers/settings.mapper.ts | High | SettingsRow + toDatabase + toDomain for new columns |
  | sqlite-settings.repository.ts | High | INSERT column list + VALUES list + UPDATE SET clause for new columns |
  | packages/core/src/infrastructure/services/agents/common/executors/claude-code-executor.service.ts | High | Override buildSpawnEnv() to inject proxy env vars based on settings |
  | packages/core/src/infrastructure/services/agents/common/agent-executor-factory.service.ts | Medium | Pass proxy config through to executor creation |
  | packages/core/src/infrastructure/services/agents/common/agent-executor-provider.service.ts | Medium | Thread settings.litellmProxy through to factory |
  | src/presentation/web/components/features/settings/ | High | New proxy routing settings section with mode selector and config fields |
