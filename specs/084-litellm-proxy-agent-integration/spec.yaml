  ## Architecture

  **Env var injection approach:** The executor's `buildSpawnEnv()` is the single
  injection point. When proxy mode is enabled for an agent, the executor adds
  LiteLLM-specific env vars to the spawned process environment. No changes to CLI
  args, stdin piping, or stream parsing.

  ```
  Settings (SQLite)                  Executor Pipeline               claude CLI
  ┌─────────────────┐              ┌──────────────────┐            ┌──────────┐
  │ litellmProxy:   │              │ buildSpawnEnv()   │            │          │
  │   baseUrl       │──Settings──►│   + ANTHROPIC_    │──spawn──►  │ claude   │
  │   apiKey        │  resolution  │     BASE_URL      │            │ -p ...   │
  │   claudeCode:   │              │   + ANTHROPIC_    │            │          │
  │     mode: proxy │              │     AUTH_TOKEN    │            └──────────┘
  │     customHdrs  │              │   + ANTHROPIC_    │
  │     sonnetModel │              │     CUSTOM_HEADERS│
  │     haikuModel  │              │   + ANTHROPIC_    │
  │     opusModel   │              │     DEFAULT_*_    │
  └─────────────────┘              │     MODEL         │
                                   └──────────────────┘
  ```

  **Three routing modes:**

  | Mode | ANTHROPIC_BASE_URL | ANTHROPIC_AUTH_TOKEN | ANTHROPIC_CUSTOM_HEADERS | Use Case |
  | --- | --- | --- | --- | --- |
  | `direct` | Not set | Not set | Not set | User's own subscription (default) |
  | `proxy` | Proxy URL | Proxy API key | User-defined (optional, for tracking) | Full proxy routing (cost tracking, model routing, caching) |
  | `passthrough` | Proxy URL | Not set | `x-litellm-api-key: Bearer <proxy-key>` + user-defined | Max/BYOK — proxy logs but user authenticates to Anthropic |

  **Model override env vars (set when non-empty, in proxy or passthrough mode):**

  | Setting Field | Environment Variable | Purpose |
  | --- | --- | --- |
  | sonnetModel | ANTHROPIC_DEFAULT_SONNET_MODEL | Override default Sonnet model (e.g., claude-sonnet-4-6) |
  | haikuModel | ANTHROPIC_DEFAULT_HAIKU_MODEL | Override default Haiku model |
  | opusModel | ANTHROPIC_DEFAULT_OPUS_MODEL | Override default Opus model |

  **Settings model extension:**
  ```
  LiteLLMProxyConfig (existing, extended):
    baseUrl?: string
    apiKey?: string
    marketplaceEnabled?: boolean  (derived from baseUrl presence)
    claudeCode?: ClaudeCodeProxyConfig  (NEW)

  ClaudeCodeProxyConfig (new):
    routingMode: "direct" | "proxy" | "passthrough"
    customHeaders?: string    (newline-separated key: value pairs)
    sonnetModel?: string      (model name override)
    haikuModel?: string       (model name override)
    opusModel?: string        (model name override)
  ```

  **Why "document only" for proxy-side validation:** LiteLLM's
  `forward_client_headers_to_llm_api` and `forward_llm_provider_auth_headers`
  are deployment-time config (often Jinja-templated in K8s). There is no
  standardized LiteLLM health endpoint that exposes general_settings config.
  The "Test Connection" button validates reachability. Mode-specific help text
  explains what proxy-side config is needed for passthrough mode.

  ## Security Requirements

  - API keys injected via env vars only — never in CLI args (avoids /proc exposure)
  - Proxy URL validated: must be http:// or https:// scheme, HTTPS required for non-localhost
  - Custom headers validated: must match `key: value` format per line, no control characters
  - No new secrets stored beyond existing pattern (plaintext in SQLite, consistent with agent.token)
  - Env var injection is internal to executor — no user-facing API exposes raw keys
  - Test connection endpoint uses same localhost-only proxy as all web API routes
  - Model override strings validated: alphanumeric, hyphens, dots, colons only (no injection)

  ## Dependencies

  - Spec 005 (Global Settings Service) — extends Settings model
  - Spec 083 (Plugin Marketplace) — shares LiteLLMProxyConfig; must not regress
  - Spec 082 (Agent Permission Modes) — permission system coexists with proxy routing

  ## Size Estimate

  **L** — ~20 new/modified files, ~1000-1500 lines. Moderate complexity because
  the infrastructure (LiteLLM settings, SQLite persistence, feature flag gating)
  already exists from spec 083. Core work: TypeSpec model extension (enum + nested
  model), one migration, settings mapper/repository updates, executor env var
  injection with mode logic, settings UI section with mode selector and conditional
  fields, model override fields, custom headers field, i18n across 8 locales, and
  comprehensive tests. No new HTTP client, no new subprocess commands, no new routes.

