# Structured technology decisions
decisions:
  - title: "Config threading: How to pass proxy config from Settings to executor"
    chosen: "Add separate proxyConfig parameter to factory.createExecutor() and executor constructor"
    rejected:
      - "Extend AgentConfig type in TypeSpec to include proxy reference"
      - "Inject full Settings object into executor"
      - "Use a global settings accessor in the executor"
    rationale: >
      Adding a separate proxyConfig parameter keeps the domain model clean (AgentConfig
      stays focused on agent identity/auth), follows the existing pattern (Codex/Gemini
      executors already receive a second config object alongside spawn), and avoids
      injecting the entire Settings blob into executors. The factory already receives
      both spawn and authConfig — adding a third parameter for proxyConfig is minimal.
      Extending AgentConfig would pollute a shared domain type with infrastructure
      concerns (proxy routing is not intrinsic to agent identity). Injecting full
      Settings violates the principle of least privilege — executors don't need 80+
      unrelated settings fields.

  - title: "Routing mode representation: Enum vs string union"
    chosen: "TypeSpec enum LiteLLMProxyRoutingMode with three values"
    rejected:
      - "String literal union type in TypeScript only"
      - "Boolean flags (useProxy, usePassthrough)"
    rationale: >
      A TypeSpec enum generates both the TypeScript type and the string values,
      ensuring consistency across domain model, persistence, and UI. Boolean flags
      create invalid state combinations (useProxy AND usePassthrough both true) and
      don't scale to new modes. String literals in TS-only miss the TypeSpec-first
      mandate. The enum has three values: "direct", "proxy", "passthrough".

  - title: "Env var injection scope: Override buildSpawnEnv() in Claude Code executor"
    chosen: "Override buildSpawnEnv() in ClaudeCodeExecutorService"
    rejected:
      - "Inject env vars in ExecutorBase (affects all agents)"
      - "Inject env vars in AgentExecutorFactory (wrong abstraction level)"
      - "Inject env vars via a middleware/wrapper around spawn"
    rationale: >
      The buildSpawnEnv() override is the established pattern — Codex injects
      CODEX_API_KEY and Gemini injects GEMINI_API_KEY using exactly this approach.
      The executor owns the knowledge of which env vars its CLI expects. Base class
      injection would force all agents through LiteLLM logic. Factory injection
      would mix infrastructure concerns into the creation pattern. A middleware
      wrapper adds unnecessary indirection.

  - title: "Custom headers format: Newline-separated vs JSON"
    chosen: "Newline-separated key: value pairs (matching ANTHROPIC_CUSTOM_HEADERS format)"
    rejected:
      - "JSON object { key: value }"
      - "Comma-separated key=value pairs"
    rationale: >
      Claude Code's ANTHROPIC_CUSTOM_HEADERS env var uses newline-separated
      "key: value" format natively (documented in LiteLLM BYOK docs). Storing
      the value in exactly this format means zero transformation at injection
      time — the settings value IS the env var value. JSON would require
      serialization/deserialization. Comma-separated is ambiguous when values
      contain commas.

  - title: "Model override storage: Per-field columns vs JSON blob"
    chosen: "Per-field TEXT columns (one per model tier)"
    rejected:
      - "Single JSON blob column for all model overrides"
      - "Key-value pair table for flexible model mappings"
    rationale: >
      Three model tiers (sonnet, haiku, opus) are a fixed, small set defined by
      Claude Code's env var interface. Per-column storage follows the existing
      settings pattern (every field has its own column), enables direct SELECT
      queries per field, and avoids JSON parsing overhead. A JSON blob would be
      appropriate for an unbounded set of model mappings, but Claude Code only
      supports three override env vars.

  - title: "Settings nesting: Flat fields vs nested ClaudeCodeProxyConfig object"
    chosen: "Nested ClaudeCodeProxyConfig model under LiteLLMProxyConfig in TypeSpec"
    rejected:
      - "Flat fields directly on LiteLLMProxyConfig"
      - "Separate top-level ProxyAgentConfig model"
    rationale: >
      Nesting under LiteLLMProxyConfig groups agent-specific proxy settings under
      the proxy config where they logically belong. Flat fields would pollute
      LiteLLMProxyConfig with agent-specific concerns that don't apply to all
      agents. A separate top-level model would disconnect proxy agent config from
      the proxy config it depends on. The nested model also prepares for multi-agent
      extension (add geminiCli?, codexCli? siblings later).

  - title: "Executor caching: Invalidate cache when proxy config changes"
    chosen: "Don't cache — create fresh executor per execution cycle"
    rejected:
      - "Keep cache, add config hash check for invalidation"
      - "Keep cache, proxy config is immutable after startup"
    rationale: >
      The current factory caches executors as singletons per agent type. Proxy config
      can change mid-session (user updates settings in UI). Caching an executor with
      stale proxy config would silently use old proxy settings. The simplest fix is
      to pass proxy config as a method parameter to buildSpawnEnv() rather than
      storing it in the constructor, OR to skip caching for Claude Code when proxy
      config is present. Since the executor is lightweight (just holds a spawn
      function reference), creating fresh instances has negligible cost.
      REFINED APPROACH: Store proxyConfig on the executor instance and provide a
      setter/update method. The factory cache stays, but the provider updates the
      proxy config on the cached executor before returning it. This preserves the
      performance benefit of caching while ensuring fresh config.

