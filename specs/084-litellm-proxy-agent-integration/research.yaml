  ## Status

  - **Phase:** Research
  - **Updated:** 2026-04-06

  ## Codebase Analysis

  ### Current Executor Pipeline

  The agent execution pipeline flows: Settings → AgentExecutorProvider → AgentExecutorFactory → *Executor → spawn(cli).

  **ExecutorBase.buildSpawnEnv()** (executor-base.ts:51-54):
  ```typescript
  protected buildSpawnEnv(): Record<string, string | undefined> {
    const { CLAUDECODE: _, ...cleanEnv } = process.env;
    return cleanEnv;
  }
  ```

  **Codex executor override pattern** (codex-cli-executor.service.ts:592-598):
  ```typescript
  protected override buildSpawnEnv(): Record<string, string | undefined> {
    const env = super.buildSpawnEnv();
    if (this.authConfig?.authMethod === 'token' && this.authConfig.token) {
      return { ...env, CODEX_API_KEY: this.authConfig.token };
    }
    return env;
  }
  ```

  **Claude Code executor** currently takes only `SpawnFunction` — no authConfig, no proxy config.

  **Factory** already receives `authConfig` but passes it only to Codex/Gemini, not Claude Code:
  ```typescript
  case 'claude-code':
    executor = new ClaudeCodeExecutorService(this.spawn); // No authConfig!
  ```

  **Provider** has full `Settings` access but only passes `settings.agent`:
  ```typescript
  return this.factory.createExecutor(settings.agent.type, settings.agent);
  ```

  ### Current LiteLLM Settings Pipeline

  **TypeSpec** (settings.tsp:514-533): `LiteLLMProxyConfig { baseUrl?, apiKey?, marketplaceEnabled? }`

  **DB columns**: `litellm_proxy_base_url TEXT`, `litellm_proxy_api_key TEXT`, `litellm_proxy_marketplace_enabled INTEGER`

  **Mapper pattern**: `toDatabase()` uses `?? null` for strings, `? 1 : 0` for booleans. `fromDatabase()` conditionally spreads the object only when at least one field is non-null.

  **Migration pattern**: Idempotent column checks via `pragma('table_info(settings)')`.

  **UI**: `LiteLLMProxySettingsSection` component with onBlur save, test connection button, password input for API key.

  ## Technology Decisions

  ### 1. Config Threading: Separate proxyConfig Parameter

  The factory and executor constructors gain a `proxyConfig?: LiteLLMProxyConfig` parameter alongside `authConfig`. The provider threads `settings.litellmProxy` through to the factory.

  **Why not extend AgentConfig?** AgentConfig is a domain model representing agent identity (type, auth method, token, permissions). Proxy routing config is an infrastructure concern — it describes how API traffic is routed, not what agent is being used. Mixing these violates separation of concerns.

  **Why not inject full Settings?** Executors would gain access to 80+ unrelated fields. The principle of least privilege says: give the executor only the data it needs to build env vars.

  ### 2. Routing Mode: TypeSpec Enum

  ```typespec
  enum LiteLLMProxyRoutingMode {
    direct: "direct",
    proxy: "proxy",
    passthrough: "passthrough"
  }
  ```

  Three distinct modes with clear semantics. No invalid state combinations. TypeSpec generates both the TS type and the allowed values.

  ### 3. Env Var Injection: buildSpawnEnv() Override

  Following the Codex/Gemini pattern exactly:

  ```typescript
  protected override buildSpawnEnv(): Record<string, string | undefined> {
    const env = super.buildSpawnEnv();
    if (!this.proxyConfig?.claudeCode) return env;
    const { routingMode, customHeaders, sonnetModel, haikuModel, opusModel }
      = this.proxyConfig.claudeCode;

    if (routingMode === 'direct' || !this.proxyConfig.baseUrl) return env;

    // Both proxy and passthrough set BASE_URL
    env.ANTHROPIC_BASE_URL = this.proxyConfig.baseUrl;

    if (routingMode === 'proxy') {
      // Proxy mode: use proxy API key as auth token
      if (this.proxyConfig.apiKey) {
        env.ANTHROPIC_AUTH_TOKEN = this.proxyConfig.apiKey;
      }
    } else if (routingMode === 'passthrough') {
      // Passthrough mode: proxy key goes in custom headers
      const headers = [];
      if (this.proxyConfig.apiKey) {
        headers.push(`x-litellm-api-key: Bearer ${this.proxyConfig.apiKey}`);
      }
      if (customHeaders) headers.push(customHeaders);
      if (headers.length) env.ANTHROPIC_CUSTOM_HEADERS = headers.join('\n');
    }

    // Model overrides (both proxy and passthrough)
    if (sonnetModel) env.ANTHROPIC_DEFAULT_SONNET_MODEL = sonnetModel;
    if (haikuModel) env.ANTHROPIC_DEFAULT_HAIKU_MODEL = haikuModel;
    if (opusModel) env.ANTHROPIC_DEFAULT_OPUS_MODEL = opusModel;

    // User-defined custom headers for proxy mode
    if (routingMode === 'proxy' && customHeaders) {
      env.ANTHROPIC_CUSTOM_HEADERS = customHeaders;
    }

    return env;
  }
  ```

  ### 4. Custom Headers: Newline-Separated Format

  Stored and injected as-is — the settings value IS the ANTHROPIC_CUSTOM_HEADERS value.
  No transformation needed. The LiteLLM docs confirm this format:
  ```
  x-litellm-customer-id: my-user-123
  x-litellm-tags: project:acme,env:prod
  ```

  ### 5. Model Overrides: Per-Column Storage

  Three columns matching Claude Code's three env vars:
  - `litellm_proxy_cc_sonnet_model TEXT` → ANTHROPIC_DEFAULT_SONNET_MODEL
  - `litellm_proxy_cc_haiku_model TEXT` → ANTHROPIC_DEFAULT_HAIKU_MODEL
  - `litellm_proxy_cc_opus_model TEXT` → ANTHROPIC_DEFAULT_OPUS_MODEL

  Column naming convention: `litellm_proxy_cc_*` prefix (cc = claude code) to namespace agent-specific fields.

  ### 6. Nested TypeSpec Model

  ```typespec
  model ClaudeCodeProxyConfig {
    routingMode?: LiteLLMProxyRoutingMode;
    customHeaders?: string;
    sonnetModel?: string;
    haikuModel?: string;
    opusModel?: string;
  }

  model LiteLLMProxyConfig {
    baseUrl?: string;
    apiKey?: string;
    marketplaceEnabled?: boolean;
    claudeCode?: ClaudeCodeProxyConfig;
  }
  ```

  ### 7. Executor Caching Strategy

  The provider calls `executor.updateProxyConfig(settings.litellmProxy)` on the
  cached executor before returning it. This keeps the singleton cache (no
  re-construction overhead) while ensuring the executor always has fresh proxy config.

  ## Library Analysis

  No new libraries needed. All implementation uses existing project dependencies:

  | Component | Existing Dep | Purpose |
  | --- | --- | --- |
  | TypeSpec models | @typespec/compiler 1.10 | Domain model for proxy config + enum |
  | DB migration | better-sqlite3 | ALTER TABLE for new columns |
  | Settings persistence | better-sqlite3 | INSERT/UPDATE with named parameters |
  | UI components | React 19, shadcn/ui | Mode selector, input fields, help text |
  | Testing | Vitest | Unit tests for env var injection logic |
  | i18n | react-i18next | Localized labels/descriptions |

  ## Security Considerations

  1. **Env var injection only** — API keys never appear in CLI args, avoiding
     /proc/PID/cmdline exposure. The buildSpawnEnv() approach inherits this
     safety from the existing pattern.

  2. **Proxy URL validation** — Must be http:// or https:// scheme. HTTPS
     required for non-localhost URLs. Validated at the settings save boundary,
     not at injection time (injection trusts persisted settings).

  3. **Custom headers validation** — Each line must match `key: value` format.
     No control characters (CR, LF injection in header names would be benign
     since they're env vars, not HTTP headers — but validate anyway for defense
     in depth). Validated at settings save boundary.

  4. **Model override validation** — Must match `[a-zA-Z0-9._:-]+` — alphanumeric
     with dots, hyphens, underscores, colons. Prevents injection of env var
     values that could confuse the shell or CLI.

  5. **No new attack surface** — No new HTTP endpoints, no new subprocess commands.
     The only change is additional env vars on an already-spawned process.

  6. **Passthrough mode trust model** — In passthrough mode, the user's own
     Anthropic auth token flows through the proxy. ShipIT does not see or store
     this token — it's handled by Claude Code's /login flow. ShipIT only injects
     the proxy routing env vars.

  ## Performance Implications

  1. **Zero runtime overhead** — Env var injection happens once at process spawn
     time (a dictionary merge). No ongoing per-request cost.

  2. **Proxy latency** — When routing through LiteLLM proxy, each API call gains
     one network hop. This is inherent to proxy architectures and not something
     ShipIT can optimize. The benefit (cost tracking, model routing, fallbacks)
     justifies the latency.

  3. **Settings load** — The provider already loads settings to get agent type.
     Threading litellmProxy through adds zero additional DB queries.

  4. **Executor cache preserved** — The update-in-place strategy avoids
     re-creating executor instances while keeping config fresh.

  ## Claude Code Env Var Reference

  Complete mapping from LiteLLM docs:

  | Env Var | Set By | Mode | Purpose |
  | --- | --- | --- | --- |
  | ANTHROPIC_BASE_URL | ShipIT | proxy, passthrough | Points Claude Code at the proxy |
  | ANTHROPIC_AUTH_TOKEN | ShipIT | proxy | Proxy virtual key (authenticates to proxy) |
  | ANTHROPIC_CUSTOM_HEADERS | ShipIT | passthrough (required), proxy (optional) | x-litellm-api-key for passthrough; tracking headers for proxy |
  | ANTHROPIC_DEFAULT_SONNET_MODEL | ShipIT | proxy, passthrough | Override default Sonnet model |
  | ANTHROPIC_DEFAULT_HAIKU_MODEL | ShipIT | proxy, passthrough | Override default Haiku model |
  | ANTHROPIC_DEFAULT_OPUS_MODEL | ShipIT | proxy, passthrough | Override default Opus model |
  | ANTHROPIC_MODEL | Not set by ShipIT | — | Per-session model override (user sets via claude --model) |

