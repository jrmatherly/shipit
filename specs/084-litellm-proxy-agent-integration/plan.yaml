  ## Testing Strategy (TDD: Tests FIRST)

  **CRITICAL:** Tests are written FIRST in each TDD cycle.

  ### Unit Tests (RED -> GREEN -> REFACTOR)

  - **Env var injection** (Phase 2): 8-10 test cases covering all routing modes,
    edge cases, model overrides, and custom headers. This is the primary TDD target.
  - **Factory threading** (Phase 3): Verify proxyConfig is passed to executor.
  - **Provider threading** (Phase 3): Verify settings.litellmProxy reaches factory.

  ### Integration Tests

  - **Settings persistence** (Phase 5): Round-trip test — save proxy agent config
    to SQLite, reload, verify all fields preserved. Follows the pattern of existing
    settings integration tests.
  - **Migration** (Phase 1): Verify migration adds columns idempotently.

  ### Component Tests

  - **Settings UI** (Phase 4): Render with each routing mode, verify conditional
    fields appear/hide, verify onBlur save calls.

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | Silent data loss from missing SQL columns | Phase 1 adds all 5 columns to INSERT + UPDATE + mapper simultaneously; integration test verifies round-trip |
  | Executor cache returns stale proxy config | Executor exposes setter; provider updates before returning cached instance |
  | Spec 083 plugin marketplace regression | Phase 1 does not modify existing LiteLLMProxyConfig fields; only adds new nested model |
  | Custom headers injection enables header smuggling | Validate format at save boundary (key: value per line, no control chars) |
  | Model override enables command injection | Validate against allowlist regex at save boundary |
  | Passthrough mode fails silently when proxy-side config missing | Help text in UI explains required proxy-side settings; test connection validates reachability |

