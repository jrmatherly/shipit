content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-04-06

  ## Architecture Overview

  ```
  Settings (SQLite)                                            claude CLI
  ┌─────────────────────────────┐                            ┌──────────┐
  │ settings.litellmProxy:      │                            │          │
  │   baseUrl: "http://proxy"   │    AgentExecutor            │  claude  │
  │   apiKey: "sk-..."          │    Provider                 │  -p ...  │
  │   claudeCode:               │   ┌───────────┐            │          │
  │     routingMode: "proxy"    │──►│ load()    │  Factory    └──────────┘
  │     customHeaders: "..."    │   │ thread    │─►┌────────┐     ▲
  │     sonnetModel: "claude-*" │   │ proxyConf │  │create()│     │
  │     haikuModel: null        │   └───────────┘  │+ proxy │  spawn()
  │     opusModel: null         │                  └────────┘     │
  └─────────────────────────────┘                      │         │
                                                       ▼         │
                                              ┌──────────────────┐
                                              │ ClaudeCodeExecutor│
                                              │ buildSpawnEnv():  │
                                              │  ANTHROPIC_BASE_  │
                                              │    URL = proxy    │
                                              │  ANTHROPIC_AUTH_  │
                                              │    TOKEN = sk-... │
                                              │  ANTHROPIC_DEFAULT│
                                              │    _SONNET_MODEL  │
                                              └──────────────────┘
  ```

  ## Implementation Strategy

  **MANDATORY TDD**: All phases with executable code follow RED-GREEN-REFACTOR.

  ### Phase 1: Foundation (TypeSpec + DB + Persistence)

  The data model drives everything. We start by defining the TypeSpec enum and
  nested model, running codegen, then building the migration and persistence
  pipeline. This phase is foundational — no TDD because TypeSpec codegen and
  SQL migrations are declarative, not behavioral.

  **Flow:** TypeSpec → codegen → migration → mapper → repository SQL → defaults factory

  The key gotcha from spec 083 experience: the INSERT column list, VALUES list,
  and UPDATE SET clause in `sqlite-settings.repository.ts` must ALL include the
  new columns. Missing any one causes silent data loss on save (settings appear
  to save but revert on reload).

  ### Phase 2: Executor Injection (TDD Core)

  This is the heart of the feature. We write failing tests for `buildSpawnEnv()`
  covering all three routing modes, then implement the override. Tests verify:
  - "direct" mode → no proxy env vars
  - "proxy" mode → ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN
  - "passthrough" mode → ANTHROPIC_BASE_URL + ANTHROPIC_CUSTOM_HEADERS with proxy key
  - Model overrides → ANTHROPIC_DEFAULT_*_MODEL env vars
  - Edge cases: missing baseUrl, missing apiKey, empty custom headers

  The executor gains a `proxyConfig` property and a setter method. The
  `buildSpawnEnv()` override reads this property to decide which env vars to set.

  ### Phase 3: Factory + Provider Threading

  Wire the proxy config from Settings through the execution pipeline:
  - Provider: extract `settings.litellmProxy` and pass to factory
  - Factory: accept `proxyConfig` parameter and pass to Claude Code executor
  - Factory interface: update type signature

  TDD: Test that the provider correctly threads proxy config, and that the
  factory passes it to the executor.

  ### Phase 4: Settings UI

  New `LiteLLMProxyRoutingSection` component below the existing proxy settings.
  Contains:
  - Radio group for routing mode (direct/proxy/passthrough)
  - Conditional fields: custom headers textarea, model override inputs
  - Mode-specific help text (passthrough shows proxy-side config reminder)
  - onBlur save pattern (matching existing proxy settings section)

  ### Phase 5: Polish (i18n + Storybook + Validation)

  - i18n keys across all 8 locales
  - Storybook story for the new section (all three modes)
  - Input validation: URL scheme, header format, model name characters
  - Integration test for round-trip persistence

