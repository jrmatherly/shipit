  ## Status

  - **Phase:** Research
  - **Updated:** 2026-04-06

  ## Technology Decisions

  ### 1. MCP Server List Endpoint

  **Options considered:**

  1. `GET /v1/mcp/server` — Admin-only endpoint, returns all servers, requires master key
  2. `GET /public/mcp_hub` — User endpoint, returns accessible servers, works with virtual key
  3. `POST /mcp` with `tools/list` — Infer servers from tool name prefixes (fragile)
  4. `GET /v1/mcp/registry.json` — Registry endpoint, requires server-side `enable_mcp_registry`

  **Decision:** Option 2 — `GET /public/mcp_hub` with user virtual key

  **Rationale:** The stored API key from spec 083 is a user virtual key, not the master
  key. The admin endpoint (`/v1/mcp/server`) returns HTTP 403 for virtual keys (see
  GitHub issue BerriAI/litellm issue 20325). The public hub endpoint respects LiteLLM's
  access control, returning only servers the key has permission to access. This is the
  correct UX — users see only what they're authorized for.

  **Response schema (from /public/mcp_hub):**
  ```json
  [
    {
      "server_id": "e856f9a3-abc6-45b1-9d06-62fa49ac293d",
      "name": "deepwiki-mcp",
      "alias": null,
      "server_name": "deepwiki-mcp",
      "url": "https://mcp.deepwiki.com/mcp",
      "transport": "http",
      "spec_path": null,
      "auth_type": "none",
      "mcp_info": {
        "server_name": "deepwiki-mcp",
        "description": "free mcp server"
      }
    }
  ]
  ```

  ### 2. MCP Tools Listing Endpoint

  **Options considered:**

  1. `GET /mcp-rest/tools/list` — REST wrapper, returns MCP tools directly
  2. `POST /mcp` with JSON-RPC `tools/list` — Native MCP protocol, requires JSON-RPC framing
  3. Don't show tools — Simpler but less useful

  **Decision:** Option 1 — `GET /mcp-rest/tools/list` with Bearer auth

  **Rationale:** REST wrapper is simpler to call from standard HTTP client (no JSON-RPC
  envelope). Returns tools in MCP protocol format. Tool names use `{server_name}-{tool_name}`
  convention enabling per-server grouping. Fetched on-demand when user opens server
  detail drawer (not on page load).

  **Tool response schema (MCP protocol):**
  ```json
  {
    "tools": [
      {
        "name": "github_mcp-list_issues",
        "title": "List Issues",
        "description": "List issues in a repository",
        "inputSchema": { "type": "object", "properties": {} }
      }
    ]
  }
  ```

  ### 3. Service Architecture

  **Options considered:**

  1. New `McpServerBrowserService` — dedicated read-only HTTP service
  2. Extend `PluginMarketplaceService` — add MCP methods to existing service
  3. Shared `LiteLLMHttpClient` base class — extract common HTTP patterns

  **Decision:** Option 1 — New dedicated `McpServerBrowserService`

  **Rationale:** Single Responsibility Principle. The existing marketplace service handles
  plugin lifecycle (fetch catalog + install/uninstall/toggle via CLI subprocess). MCP
  browsing is purely read-only HTTP. Different concerns, different services. The HTTP
  client pattern (fetch + AbortController + Zod) is small enough to replicate without
  a shared abstraction.

  **Service interface:**
  ```typescript
  interface IMcpServerBrowserService {
    fetchServers(proxyBaseUrl: string, apiKey?: string): Promise<McpServerInfo[]>;
    fetchTools(proxyBaseUrl: string, apiKey?: string): Promise<McpToolInfo[]>;
  }
  ```

  ### 4. Feature Flag Approach

  **Options considered:**

  1. New `featureFlags.mcpServers` — independent flag, same chain as `plugins`
  2. Reuse `featureFlags.plugins` — couple MCP servers to plugin marketplace
  3. No flag — always visible when proxy is configured

  **Decision:** Option 1 — New independent `featureFlags.mcpServers`

  **Chain (9 files to touch):**
  1. `tsp/domain/entities/settings.tsp` — add `mcpServers: boolean = false`
  2. `packages/core/src/domain/generated/output.ts` — `pnpm tsp:codegen`
  3. `packages/core/src/domain/factories/settings-defaults.factory.ts` — add default
  4. Migration `057-add-mcp-servers-flag.ts` — `feature_flag_mcp_servers INTEGER DEFAULT 0`
  5. `settings.mapper.ts` — SettingsRow + toDatabase + toDomain
  6. `sqlite-settings.repository.ts` — INSERT + UPDATE column lists
  7. `src/presentation/web/lib/feature-flags.ts` — FeatureFlagsState + ENV fallback
  8. `feature-flags-settings-section.tsx` — toggle row
  9. `translations/*/web.json` — label + description (all 8 locales)

  ### 5. Tool-to-Server Grouping

  **Decision:** Parse `{server_name}-{tool_name}` prefix from global tools list

  **Algorithm:**
  1. Fetch server list to extract all `server_name` values
  2. Fetch tools list; for each tool, check if `tool.name` starts with `{server_name}-`
  3. If match: group tool under that server (strip prefix for display name)
  4. If no match: place in "Other" group (show full tool name)
  5. Sort servers alphabetically, tools alphabetically within each server

  ### 6. UI Component Architecture

  **Decision:** Mirror the plugins page pattern from spec 083.

  **Component tree:**
  ```
  app/mcp-servers/page.tsx          (server: feature flag gate + settings load)
    McpServersPageClient            (client: state, fetch, search, filter, grid)
      McpServerCard                 (card: name, transport badge, auth indicator)
      McpServerDetailDrawer         (drawer: full details + on-demand tool list)
        McpToolList                 (tools: grouped by server, expandable)
  ```

  ## Library Analysis

  | Library | Version | Purpose | Pros | Cons |
  | --- | --- | --- | --- | --- |
  | Zod | existing | Validate proxy responses | Runtime type safety, established pattern | Manual schema maintenance |
  | native fetch | Node 22+ | HTTP client for proxy | No new dep, AbortController, established | - |
  | lucide-react | existing | Server card icons | Consistent icon set (Server, Wifi, Terminal) | - |

  **No new dependencies required.** All libraries already in project from spec 083.

  ## Security Considerations

  **Reduced attack surface vs spec 083:** Read-only feature with no subprocess calls.

  1. **Untrusted proxy data:** Zod schema validation on all responses before rendering
  2. **URL display:** Server URLs validated for http/https scheme, display-only (no links)
  3. **XSS prevention:** React default escaping handles untrusted strings; no raw HTML injection
  4. **API key exposure:** Key in Authorization header only, never rendered in UI
  5. **Localhost proxy:** All routes through existing localhost-only proxy

  ## Performance Implications

  1. **Page load:** Single request to `/public/mcp_hub` (5-20 servers typical)
  2. **Drawer open:** Single request to `/mcp-rest/tools/list`, cached in component state
  3. **No polling:** Static config data, manual refresh button for re-fetch
  4. **Timeout:** 10-second AbortController timeout, silent failure to empty state

