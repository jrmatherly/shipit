# Structured technology decisions
decisions:
  - title: "MCP server list endpoint"
    chosen: "GET /public/mcp_hub with user virtual key"
    rejected:
      - "GET /v1/mcp/server (admin-only, requires master key)"
      - "POST /mcp with tools/list and infer servers from tool name prefixes"
      - "GET /v1/mcp/registry.json (requires enable_mcp_registry server config)"
    rationale: >
      The stored API key from spec 083 is a user-specific virtual key, not the
      admin/master key. The /public/mcp_hub endpoint works with virtual keys and
      respects LiteLLM access control (returns only servers the key has permission
      to access). The admin endpoint returns 403 for virtual keys. The tools/list
      workaround is fragile (noted in GitHub issue 20325). The registry endpoint
      requires server-side config we cannot guarantee.

  - title: "MCP tools listing endpoint"
    chosen: "GET /mcp-rest/tools/list with Bearer auth"
    rejected:
      - "POST /mcp with JSON-RPC tools/list method"
      - "Don't show tools at all"
    rationale: >
      The REST wrapper is simpler to call from a standard HTTP client (no JSON-RPC
      framing). Returns tools in MCP protocol format with name, description, and
      inputSchema. Tool names use {server_name}-{tool_name} convention which allows
      grouping by server. On-demand fetch in detail drawer avoids loading all tools
      on page load.

  - title: "Service architecture pattern"
    chosen: "New McpServerBrowserService mirroring PluginMarketplaceService HTTP-only pattern"
    rejected:
      - "Extend PluginMarketplaceService with MCP methods"
      - "Shared generic LiteLLM HTTP client base class"
    rationale: >
      Single Responsibility: the existing service manages plugin lifecycle (fetch +
      install/uninstall/toggle via CLI subprocess). MCP browsing is read-only
      HTTP. Different concerns = different services. A shared base class is premature
      abstraction for 2 services. Separate service follows the established
      one-service-per-domain pattern and keeps the port interface focused.

  - title: "Feature flag approach"
    chosen: "New featureFlags.mcpServers flag, same chain as plugins"
    rejected:
      - "Reuse featureFlags.plugins flag"
      - "No feature flag (always visible when proxy configured)"
    rationale: >
      MCP servers and plugins are distinct features. Independent flags let users enable
      MCP visibility without the plugin marketplace (and vice versa). The feature flag
      chain is well-established with 8 existing flags. Adding one more is minimal overhead.

  - title: "Tool-to-server grouping strategy"
    chosen: "Parse {server_name}-{tool_name} prefix from /mcp-rest/tools/list response"
    rejected:
      - "Call per-server MCP endpoint {server_alias}/mcp with tools/list"
      - "Don't group tools by server"
    rationale: >
      The /mcp-rest/tools/list endpoint returns all accessible tools with server-prefixed
      names (e.g., github_mcp-list_issues). Parsing the prefix against known server names
      from the hub response is pragmatic and avoids N+1 per-server requests. Fallback:
      tools with unmatched prefixes shown in an Other group. This approach is documented
      in LiteLLM's permission management docs.

  - title: "UI component architecture"
    chosen: "Mirror plugins page pattern: server component -> client page -> card grid -> detail drawer"
    rejected:
      - "Inline MCP servers in settings page"
      - "Table layout instead of card grid"
    rationale: >
      Card grid with detail drawer is the established pattern from spec 083 (plugins).
      Users benefit from visual consistency across LiteLLM features. The card layout
      provides better information density for server metadata (name, transport badge,
      description, auth indicator) than a table. Detail drawer follows BaseDrawer
      pattern with on-demand tool loading.

