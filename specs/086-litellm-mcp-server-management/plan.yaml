content: |
  ## Status

  - **Phase:** Planning
  - **Updated:** 2026-04-06

  ## Architecture Overview

  ```
  LiteLLM Proxy                    ShipIT Core                      ShipIT Web UI
  +------------------+            +---------------------+          +-------------------+
  | GET /public/     |  HTTP GET  | McpServerBrowser    |          | MCP Servers Page  |
  |   mcp_hub        |<-----------| Service             |          |                   |
  |                  | servers    | (Zod validation)    |          | McpServersPage-   |
  +------------------+            +---------------------+          |   Client          |
                                    |         |                    |   McpServerCard   |
  +------------------+  HTTP GET    |         |                    |   McpServerDetail |
  | GET /mcp-rest/   |<------------+         |                    |     Drawer        |
  |   tools/list     | tools                 |                    |   McpToolList     |
  |                  | (on-demand)            |                    +-------------------+
  +------------------+            +---------------------+                   |
                                  | FetchMcpServers     |<--server action---+
                                  | FetchMcpServerTools |
                                  | (Use Cases)         |
                                  +---------------------+
                                           |
                                  +---------------------+
                                  | Settings (SQLite)   |
                                  | featureFlags.       |
                                  |   mcpServers        |
                                  | litellmProxy.       |
                                  |   baseUrl + apiKey  |
                                  +---------------------+
  ```

  ## Implementation Strategy

  **MANDATORY TDD**: All phases with executable code follow RED-GREEN-REFACTOR cycles.

  **Phase ordering rationale:**

  1. **Domain layer first** (Phase 1): TypeSpec model + feature flag chain establishes the
     data foundation. The flag column must exist before any UI can render. This is
     foundational (no TDD — declarative config).

  2. **Infrastructure service** (Phase 2): HTTP client + Zod schemas are the core runtime
     logic. TDD: write tests for fetch behavior (success, timeout, validation failure,
     empty response) FIRST, then implement.

  3. **Application use cases** (Phase 3): Thin orchestration layer that reads settings and
     calls the service. TDD: test settings reading, guard conditions, delegation to service.

  4. **Presentation layer** (Phase 4): Server actions, page, and components. TDD for server
     actions. Components use Storybook for visual testing.

  5. **Integration** (Phase 5): Wire everything together — sidebar nav, settings toggle,
     i18n, Storybook stories. Run full test suite and validate.

  **Key pattern: mirror spec 083 (plugins).** Every layer follows the exact same file
  structure and code patterns. The research document maps each pattern to its source file.

