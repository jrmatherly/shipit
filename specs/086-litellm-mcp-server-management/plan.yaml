  ## Testing Strategy (TDD: Tests FIRST)

  **CRITICAL:** Tests are written FIRST in each TDD cycle.

  ### Unit Tests (RED -> GREEN -> REFACTOR)

  - **McpServerBrowserService**: fetch success, timeout, invalid JSON, Zod validation
    failure, empty response, HTTP error codes, size limit exceeded, redirect rejection,
    tool name prefix parsing
  - **FetchMcpServersUseCase**: settings missing, proxy not configured, flag disabled,
    successful fetch delegation
  - **FetchMcpServerToolsUseCase**: settings missing, successful fetch delegation,
    tool grouping by server name prefix

  ### Integration Tests

  - **Migration 057**: column added, idempotent re-run, default value correct
  - **Settings persistence**: mcpServers flag round-trips through save/load
  - **i18n parity**: all 8 locales have matching key sets

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | /public/mcp_hub response schema changes | Zod schema with `.passthrough()` on mcp_info, graceful fallback to empty array |
  | Tool name prefix convention changes | Fallback "Other" group for unmatched tools, no crash on parse failure |
  | LiteLLM proxy unreachable | 10s AbortController timeout, silent failure, "no servers" empty state |
  | Feature flag migration conflicts | Idempotent migration with pragma column check |
  | i18n key drift | Translation parity test catches missing keys in CI |

