# Markdown content (the actual spec)
content: |
  ## Problem Statement

  LiteLLM proxy supports deploying MCP servers (Model Context Protocol tools for LLMs)
  via config.yaml or the LiteLLM admin UI. Organizations using LiteLLM for cost tracking,
  model routing, and policy enforcement configure MCP servers for code search, documentation
  lookup, database access, and other capabilities. These servers are then available to
  LLM requests routed through the proxy.

  There is currently no way to view which MCP servers are available, their configuration,
  access groups, or tool listings from within ShipIT. Users must navigate to the LiteLLM
  admin UI separately to see what MCP infrastructure is deployed.

  This feature adds an **MCP Servers page** to the ShipIT web UI that fetches the list
  of configured MCP servers from the LiteLLM proxy (`GET /public/mcp_hub`), displays them
  in a visual card grid with search/filter, and shows server details including transport
  type, authentication method, access groups, and available tools. This is **read-only** —
  no CRUD operations (create/update/delete remain admin-only via LiteLLM UI/config).

  ## Success Criteria

  - [ ] Users can browse MCP servers fetched from their LiteLLM proxy via `GET /public/mcp_hub`
  - [ ] Users can search servers by name/description
  - [ ] Users can filter servers by transport type (HTTP, SSE, STDIO)
  - [ ] Server card shows: name, transport type badge, description, auth type indicator
  - [ ] Server detail drawer shows: name, URL, transport, auth type, access groups, description
  - [ ] Server detail drawer shows available tools fetched on-demand via `GET /mcp-rest/tools/list`
  - [ ] Tools are grouped by server using the `{server_name}-{tool_name}` naming convention
  - [ ] Feature gated behind `featureFlags.mcpServers` (off by default)
  - [ ] MCP Servers nav item only visible when feature flag is enabled
  - [ ] Page shows "no proxy configured" empty state when `litellmProxy.baseUrl` is not set
  - [ ] All proxy-supplied data validated with Zod schemas before rendering
  - [ ] All 8 locale files have complete i18n key parity for new strings
  - [ ] Every UI component has a colocated Storybook story
  - [ ] TDD workflow followed: failing tests first in every phase

