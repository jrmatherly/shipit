  ## Architecture

  **Thin read-only proxy approach:** ShipIT fetches the MCP server list from LiteLLM's
  public hub endpoint and displays it. No write operations, no subprocess calls.

  ```
  LiteLLM Proxy                    ShipIT                         Web UI
  +------------------+  HTTP GET  +-------------------+          +-----------------+
  | GET /public/     |<-----------| McpServerBrowser  |          |                 |
  |   mcp_hub        | server    | Service            |--------->| MCP Servers     |
  |                  | list      |                    |          | Page (card grid |
  +------------------+           +-------------------+          | + detail drawer)|
                                        |                       +-----------------+
  +------------------+  HTTP GET        |
  | GET /mcp-rest/   |<----------------+
  |   tools/list     | tools
  |                  | (on-demand)
  +------------------+
  ```

  **API Endpoints Used:**

  | Endpoint | Method | Auth | Returns | When Called |
  | --- | --- | --- | --- | --- |
  | `/public/mcp_hub` | GET | User API key (Bearer) | MCP servers accessible to user's key | Page load |
  | `/mcp-rest/tools/list` | GET | User API key (Bearer) | Available tools across MCP servers | Detail drawer open |

  **User API key (not admin key):** The stored API key from spec 083 is a user-specific
  virtual key. The `/public/mcp_hub` endpoint respects LiteLLM's access control, returning
  only servers the user's key has permission to access (via `allow_all_keys`, team, or
  org assignments). This is the correct behavior — users see only what they're authorized for.

  **Tool-to-server grouping:** LiteLLM's `/mcp-rest/tools/list` returns tools with names
  prefixed by server name (e.g., `github_mcp-list_issues`). The service parses this
  `{server_name}-{tool_name}` convention to group tools by their parent server for display
  in the detail drawer. If parsing fails (no prefix match), tools are shown ungrouped.

  **MCP Server response schema (expected from /public/mcp_hub):**
  ```typescript
  interface McpServerInfo {
    server_id: string;
    name: string;
    server_name: string;     // alias used in URL namespacing
    url?: string;            // endpoint URL (HTTP/SSE transports)
    transport: 'sse' | 'http' | 'stdio';
    auth_type?: string;      // api_key, bearer_token, basic, oauth2, aws_sigv4
    description?: string;
    allow_all_keys?: boolean;
    access_groups?: string[];
    mcp_info?: Record<string, unknown>;  // additional metadata
  }
  ```

  **Reuses existing infrastructure:** No new settings fields beyond the feature flag.
  The LiteLLM proxy baseUrl and apiKey from spec 083 are used as-is. The HTTP client
  pattern (fetch + AbortController + Zod) mirrors PluginMarketplaceService.

  ## Security Requirements

  - All data from `/public/mcp_hub` and `/mcp-rest/tools/list` is untrusted input
  - Zod runtime schema validation for all proxy responses before rendering
  - URL scheme validation on server URLs before display (http/https only)
  - String truncation for server names, descriptions, and tool names in UI
  - No secrets exposed: API key used only in Authorization header, never rendered
  - Read-only: no write endpoints, no subprocess calls, no command injection surface
  - API routes go through existing localhost-only proxy

  ## Dependencies

  - Spec 083 (Plugin Marketplace) — reuses LiteLLMProxyConfig settings (baseUrl, apiKey)
  - Spec 005 (Global Settings Service) — extends FeatureFlags with mcpServers flag

  ## Size Estimate

  **L** — ~25 new/modified files, ~1500 lines. Moderate complexity because most
  infrastructure already exists from spec 083. Core new work: feature flag chain
  (TypeSpec + migration + mapper + repository + defaults + UI toggle), service layer
  (HTTP client for 2 endpoints with Zod validation), 2 use cases, 2 server actions,
  new page route with card grid + detail drawer + tool listing, i18n across 8 locales,
  Storybook stories, and comprehensive tests. No subprocess calls, no new settings
  fields beyond the flag. Simpler than spec 083 (no install/uninstall/toggle operations).

