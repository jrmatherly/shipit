# =============================================================================
# Pull Request Check Workflow
# =============================================================================
# Additional checks for pull requests including commit message validation.

name: ✅ PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny-all default — every job MUST opt into the permissions it needs.
permissions: {}

jobs:
  # ===========================================================================
  # Commit Message Validation
  # ===========================================================================
  commitlint:
    name: ✅ Validate Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v5

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Validate commit messages
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ===========================================================================
  # PR Title Validation (Conventional Commits)
  # ===========================================================================
  pr-title:
    name: ✅ PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: 🔍 Check PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            specs
            shipit-kit
            cli
            tui
            web
            api
            domain
            agents
            deployment
            tsp
            deps
            config
            dx
            release
            ci
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            PR title subject must start with lowercase letter.
            Example: "feat(cli): add new command"
